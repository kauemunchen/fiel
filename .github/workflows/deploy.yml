# Deploy automático: todo push na main puxa o código no VPS e reinicia o container.
# Secrets necessários no repo (Settings → Secrets and variables → Actions):
#   VPS_HOST     — IP ou DNS do servidor (ex.: 191.252.198.149)
#   VPS_PORT     — porta SSH (ex.: 22 ou 65002)
#   VPS_USER     — usuário SSH (ex.: root)
#   VPS_SSH_KEY  — chave privada no formato OpenSSH (conteúdo do id_ed25519)
#   VPS_PATH     — caminho do projeto no servidor (ex.: /docker/assessor)
# Opcionais (se preenchidos, são gravados/atualizados no .env do servidor a cada deploy):
#   INSTAGRAM_APP_ID, INSTAGRAM_APP_SECRET — login do Instagram (botão Conectar Instagram)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no VPS por SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: INSTAGRAM_APP_ID,INSTAGRAM_APP_SECRET
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH }}"
            echo "==> git pull"
            git fetch --all --prune
            git reset --hard origin/main
            echo "==> variáveis opcionais no .env"
            upsert() { [ -n "$2" ] || return 0; touch .env; if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else printf '\n%s=%s\n' "$1" "$2" >> .env; fi; echo "$1 atualizado"; }
            upsert INSTAGRAM_APP_ID "${INSTAGRAM_APP_ID:-}"
            upsert INSTAGRAM_APP_SECRET "${INSTAGRAM_APP_SECRET:-}"
            echo "==> docker compose up -d --build"
            docker compose up -d --build render assessor
            echo "==> status"
            docker compose ps assessor
            echo "==> últimas 30 linhas de log"
            docker compose logs --tail=30 assessor || true
            echo "==> deploy ok"
