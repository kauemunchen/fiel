name: inspecao
on:
  push:
    branches: [inspecao-vps]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            f=/docker/kmapp-landing/html/index.html; wc -c $f; grep -n "<footer" $f; awk '/<footer/,/<\/footer>/' $f | head -40
