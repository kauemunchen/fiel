# Utilitário (manual): baixa arquivos de mídia gerados por IA (ex.: narração) e devolve como artifact.
name: baixar-midia
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço"
        required: true
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p midia; i=0
          for u in $URLS; do
            case "$u" in https://*.fal.media/*|https://fal.media/*) ;; *) echo "ignorado: $u"; continue;; esac
            i=$((i+1)); curl -sSfL --max-time 120 -o "midia/$(printf %02d $i)_$(basename "$u")" "$u"
          done
          ls -la midia
      - name: Publicar no ramo temporário 'midia' (sobrescreve a cada uso)
        run: |
          cd midia
          git init -q -b midia && git config user.name "fiel-bot" && git config user.email "bot@usefiel.com"
          git add -A && git commit -qm "mídia temporária"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" midia
