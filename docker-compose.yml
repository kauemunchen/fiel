services:
  render:
    build: ./render
    container_name: assessor-render
    restart: unless-stopped
    expose: ["5055"]
  # Bot API local do Telegram (opcional). Ativar com: docker compose --profile bigfiles up -d --build
  # Antes, uma vez: curl "https://api.telegram.org/bot$TOKEN/logOut" (tira o bot do servidor da nuvem). Voltar: /close no local.
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    container_name: assessor-telegram-api
    restart: unless-stopped
    profiles: ["bigfiles"]
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_MAX_CONNECTIONS=10
    expose: ["8081"]
    volumes:
      - ./data/telegram-api:/var/lib/telegram-bot-api
  assessor:
    depends_on: [render]
    environment:
      - RENDER_URL=http://render:5055
      # Login do Google: retorno no domínio da marca (exigência da verificação do Google)
      - GOOGLE_REDIRECT_URI=https://usefiel.com/oauth/google/callback
      # Seletor de arquivos do Google (chave pública do navegador, restrita a usefiel.com e à Picker API)
      - GOOGLE_PICKER_KEY=AIzaSyAOJJwXw_nJtu1xGhTY2ShYEzDwptIxwMk
      # Login do Instagram (botão Conectar Instagram); INSTAGRAM_APP_ID/INSTAGRAM_APP_SECRET ficam no .env (o deploy grava a partir dos Secrets do GitHub)
      - INSTAGRAM_REDIRECT_URI=https://usefiel.com/oauth/instagram/callback
    build: .
    container_name: assessor-km
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./data:/app/data
      - ./src/personas:/app/src/personas
      - ./src/conhecimento:/app/src/conhecimento
      - ./src/painel:/app/src/painel
      - ./data/uploads:/app/data/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.assessor.rule=Host(`usefiel.com`) || Host(`assessor.kauemunchen.com.br`)
      - traefik.http.routers.assessor.entrypoints=websecure
      - traefik.http.routers.assessor.tls.certresolver=letsencrypt
      - traefik.http.services.assessor.loadbalancer.server.url=http://127.0.0.1:3010
